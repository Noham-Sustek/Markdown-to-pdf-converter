[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpdf"
version = "1.2.0"
description = "Convertisseur Markdown / AsciiDoc vers PDF, 100% hors-ligne (Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "playwright>=1.40",
    "asciidoc>=10.2",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
mdpdf = "mdpdf.cli:main"

[project.gui-scripts]
mdpdf-gui = "mdpdf.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdpdf = ["assets/**/*"]
